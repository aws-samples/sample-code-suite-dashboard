version: 0.2

phases:
  install:
    commands:
      - echo "No runtime needed; this is a static site."
  build:
    commands:
      - echo "Validating HTML files..."
      - |
        for f in $(find . -name '*.html'); do
          if ! grep -q "<title>" "$f"; then
            echo "ERROR: $f is missing a <title> tag"
            exit 1
          fi
        done
      - echo "All HTML files have a title."
  post_build:
    commands:
      - echo "Static site build complete on $(date -u +%FT%TZ)"

artifacts:
  base-directory: .
  files:
    - 'index.html'
    - 'assets/**/*'
  discard-paths: no
