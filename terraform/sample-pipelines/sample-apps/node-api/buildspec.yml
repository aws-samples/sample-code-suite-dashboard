version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install --no-audit --no-fund
  build:
    commands:
      - echo "Running unit tests..."
      - npm test
  post_build:
    commands:
      - echo "Node build complete on $(date -u +%FT%TZ)"

artifacts:
  files:
    - index.js
    - package.json
  discard-paths: no
